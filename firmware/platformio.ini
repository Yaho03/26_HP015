; PlatformIO project configuration for 26_HP015 firmware.
;
; Two build environments share the common [env] section:
;   pio run -e sensor-node      (Full-Spec 센서 노드 x4)
;   pio run -e wearable-node    (웨어러블 노드 x1)
;
; Sensor drivers, MQTT, and WiFi are implemented in follow-up issues (#39-#45, #68).

[platformio]
default_envs = sensor-node
src_dir = src

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.1
; Wire (I2C)와 SPI는 Arduino-ESP32 프레임워크에 내장되어 있어 lib_deps에 명시하지 않는다.

[env:sensor-node]
build_flags = -D NODE_SENSOR

[env:wearable-node]
build_flags = -D NODE_WEARABLE
