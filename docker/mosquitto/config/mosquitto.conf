# Mosquitto 설정 — 로컬 개발용 (이슈 #35).
listener 1883

# 익명 접속 금지, 비밀번호 파일 기반 인증.
# passwordfile 은 mosquitto_passwd 로 생성한다 (docker/README.md 참고). 커밋하지 않는다.
allow_anonymous false
password_file /mosquitto/config/passwordfile

# 메시지 영속화 (재시작 후 retain 메시지 유지)
persistence true
persistence_location /mosquitto/data/

# 로그를 stdout 으로 (docker compose logs 로 확인)
log_dest stdout
