# 로컬 개발용 인프라: TimescaleDB + Mosquitto (이슈 #35).
#
# 실행:   cd docker && docker compose up -d
# 중지:   docker compose down
#
# 비밀 값(비밀번호)은 docker/.env 에서 읽는다 (커밋 금지). docker/.env.example 참고.
# DB 스키마/hypertable은 #50, MQTT 메시지 로직은 #44에서 구현한다.

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: hp015-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in docker/.env}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hp015-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hp015-backend
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      TIMESCALE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # 데모 제어 API. 인증(#116) 전이라 기본은 꺼둔다 — 켜면 누구나 안전
      # 시스템에 가짜 값을 주입하거나 실제 경보를 덮을 수 있다.
      # 시연·개발 환경에서만 docker/.env 에 DEMO_CONTROL_ENABLED=true 로 켠다.
      DEMO_CONTROL_ENABLED: ${DEMO_CONTROL_ENABLED:-false}
      # 최초 관리자 부트스트랩 (AUTH-9). 사용자 0명일 때만 1회 생성되고
      # 첫 로그인 후 비밀번호 변경을 강제한다.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    # 호스트에 포트를 노출하지 않는다 (이슈 #105 수정안, 코드리뷰 반영) — 프론트엔드는
    # nginx(frontend 컨테이너)가 /api, /ws를 backend:8000으로 내부 프록시하므로 필요 없고,
    # 호스트에 열어두면 CORS 우회 경로가 하나 더 생기는 셈이라 배포 스택에선 막는 게 맞다.
    # 로컬에서 백엔드를 직접 찌르며 디버깅해야 하면 `docker compose exec backend curl ...`
    # 또는 `docker compose port backend 8000`으로 임시 확인.

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: hp015-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 컨테이너는 비root nginx 라 8080 을 듣는다 (이슈 #128). 외부 포트는 그대로.
      - "5173:8080"

volumes:
  timescale-data:
  mosquitto-data:
